<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Complex Enough</title>
  <script>
    (function () {
      var target = navigator.language && navigator.language.toLowerCase().startsWith('zh') ? './zh-TW/' : './en/';
      window.location.replace(target);
    }());
  </script>
</head>
<body>
  <main>
    <h1>Complex Enough</h1>
    <p><a href="./en/">English</a> · <a href="./zh-TW/" lang="zh-Hant">繁體中文</a></p>
  </main>
</body>
</html>
